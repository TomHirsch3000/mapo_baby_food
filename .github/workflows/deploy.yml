name: Deploy to GitHub Pages

# The site is entirely static: the evidence JSON under frontend/public/claims is
# committed, so a build needs no database, no API keys and no network beyond npm.
# That is what makes free static hosting viable at all.

on:
  push:
    branches:
      - main
      - claude/setup-local-development-VmyfD
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; cancel-in-progress is off so a queued deploy of
# newer data still runs rather than being dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # Mount every view in jsdom before publishing. A clean `vite build` says
      # nothing about whether a screen renders - three separate blank screens
      # got through it during development - so this is the gate that matters.
      - name: Smoke test
        working-directory: frontend
        run: npm run smoke

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Check the data actually shipped
        working-directory: frontend
        run: |
          test -f dist/claims/topics.json || { echo "topics.json missing from build"; exit 1; }
          claims=$(find dist/claims -name claims.json | wc -l)
          evidence=$(find dist/claims -name evidence.json | wc -l)
          echo "topics: $claims  claims with evidence files: $evidence"
          test "$claims" -ge 10 || { echo "too few topics in build"; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
